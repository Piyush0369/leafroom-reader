<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Spread curl verification</title><style>
body{margin:0}.checks{padding:16px;display:flex;justify-content:center;gap:20px;align-items:center;font:12px Arial}.checks input{width:220px}.test-note{text-align:center;font:12px Arial}.scene{height:580px!important}.book-camera{zoom:1!important}.book,.leaf{transition:none!important}
</style><body><div class="checks"><label>Turn <input id="amount" type="range" min="0" max="1" step=".01" value=".3"></label><output id="value">30%</output><label>Direction <select id="direction"><option value="1">Next page</option><option value="-1">Previous page</option></select></label><label>Corner <select id="corner"><option value="1">Bottom</option><option value="0">Top</option></select></label><button id="replay">Play full turn</button></div><p class="test-note" id="status">Preparing…</p><div class="scene"><div class="book-camera"><div class="book open" id="book"></div></div></div>
<script src="/paper-dynamics.js?v=paper-arc-13"></script><script src="/paper-surface.js?v=paper-arc-13"></script><script src="/paper-turn.js?v=paper-arc-13"></script><script>
(async()=>{
 const html=await(await fetch('/index.html')).text(),parsed=new DOMParser().parseFromString(html,'text/html'),style=document.createElement('style');style.textContent=parsed.querySelector('style').textContent;document.head.prepend(style);
 const book=document.querySelector('#book');let paper,request=0,play=0;
 const texts=[
 'THE ART OF NOTICING\n\nOn the quiet beauty of ordinary things\n\nThere is a particular kind of light that enters a room before the rest of the world has woken. It settles on the edge of a table and catches the rim of a cup.\n\nMost days, we walk right past it. We have places to be, messages to answer, small urgent things that fill the space where wonder used to live.',
 'A bird lands on the windowsill. The kettle begins its gentle song. A familiar street looks unfamiliar in the rain. And for a moment, we are here.\n\nThis is a book about those moments.\n\nI. THE PRACTICE OF PAUSING\n\nBegin with the window nearest you. Look through it without searching for anything in particular. Let your eyes rest on the shapes of things.',
 'Nothing needs to happen. That is the difficult part, and the lovely part too. We are so accustomed to making something of every minute that an unclaimed moment can feel like a small mistake.\n\nBut attention is not a task to finish. It is a door left open.\n\nWhen you take your next walk, leave a little room for a detour. Choose the path that bends out of sight.',
 'The world is full of invitations written in a language we knew before we learned to hurry.\n\nII. SMALL RITUALS\n\nMaking a cup of tea. Writing a letter. Opening a book to the place where we left a leaf between the pages. These small ceremonies give shape to otherwise shapeless hours.\n\nTry doing one ordinary thing with your whole attention. Wash a bowl slowly. Feel the weight of it, the warmth of the water.'
 ];
 function page(text,number,side){const face=document.createElement('div');face.className='face page '+side;const head=document.createElement('div'),body=document.createElement('div'),folio=document.createElement('div');head.className='running-head';head.textContent='The Art of Noticing';body.className='page-text';body.textContent=text;folio.className='page-number';folio.textContent=number;face.append(head,body,folio);return face;}
 const left=document.createElement('div');left.className='leaf flipped top-left';left.style.zIndex=1;left.append(page('',0,'front'),page(texts[0],1,'back'));
 const moving=document.createElement('div');moving.className='leaf top-right';moving.style.zIndex=3;moving.append(page(texts[1],2,'front'),page(texts[2],3,'back'));
 const right=document.createElement('div');right.className='leaf top-right';right.style.zIndex=0;right.append(page(texts[3],4,'front'),page('',5,'back'));book.append(left,moving,right);
 await Promise.all([PageArtwork.prepare(left.children[1]),PageArtwork.prepare(right.children[0])]);
 function draw(){if(!paper||paper.disposed)return;play++;paper.stopAnimation();const amount=Number(document.querySelector('#amount').value),delta=Number(document.querySelector('#direction').value);paper.options.cornerV=Number(document.querySelector('#corner').value);paper.seek(delta>0?amount:1-amount);document.querySelector('#value').textContent=Math.round(amount*100)+'%';}
 async function rebuild(){const ticket=++request;paper?.destroy();const next=await PaperTurn.create({book,front:moving.children[0],back:moving.children[1],hidden:moving,delta:Number(document.querySelector('#direction').value),single:false});if(ticket!==request){next.destroy();return;}paper=next;paper.mount();draw();document.querySelector('#status').textContent='Whole-page arc: gentle bend, subtle corner curl and shared sharp text.';}
 document.querySelector('#replay').onclick=async()=>{if(!paper||paper.disposed)return;const token=++play,delta=Number(document.querySelector('#direction').value);paper.stopAnimation();paper.dragged=false;paper.grip=null;paper.seek(delta>0?0:1);document.querySelector('#status').textContent='Playing the complete page turn…';await paper.animate(delta>0?1:0,1100);if(token!==play)return;document.querySelector('#amount').value=1;document.querySelector('#value').textContent='100%';document.querySelector('#status').textContent='Full turn complete. Both faces stay on one gently curved sheet.';};
 document.querySelector('#amount').oninput=draw;document.querySelector('#corner').onchange=draw;document.querySelector('#direction').onchange=rebuild;await rebuild();
})().catch(error=>document.querySelector('#status').textContent='FAILED: '+error.message);
</script></body></html>
