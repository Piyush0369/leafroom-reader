<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Single-page turn verification</title><style>
body{margin:0}#checks{padding:14px;display:flex;gap:10px;flex-wrap:wrap;align-items:center;font:12px Arial}#checks input{width:130px}#checks input[type=checkbox]{width:auto}#scene.scene{height:calc(100dvh - 160px);min-height:450px}#scene .book-camera{zoom:1!important;width:300px;height:412px}#book{transition:none!important;width:300px;height:412px}.test-page{padding:24px!important;font:13px/1.7 Georgia,serif}.test-page h2{font:bold 40px Georgia,serif;margin:26px 0 32px}.test-page .plate-label{font-size:10px;letter-spacing:1px}.test-page .plate-number{position:absolute;bottom:22px;left:0;right:0;text-align:center;font-size:11px}#result{font:12px Arial;text-align:center;margin:4px}
.finger-target{position:absolute;width:14px;height:14px;border:2px solid white;border-radius:50%;background:#426958;box-shadow:0 0 0 2px #426958;transform:translate(-50%,-50%) translateZ(4px);z-index:100001;pointer-events:none}.finger-target[hidden]{display:none}</style></head><body>
<div id="checks"><label>Direction <select id="direction"><option value="1">Next (swipe left)</option><option value="-1">Previous (swipe right)</option></select></label><label>Curl <input id="amount" type="range" min="0" max="1" step=".01" value=".4"></label><label><input id="follow" type="checkbox" checked> Pin to finger</label><label>Vertical pull <input id="vertical" type="range" min="-.2" max=".2" step=".01" value="-.06"></label><button id="release">Release</button></div><p id="result">Preparing…</p>
<div id="scene" class="scene single-page"><div class="book-camera"><div id="book" class="book single-page"><div class="leaf"><div id="current" class="face front page test-page single-current"><canvas width="600" height="824"></canvas></div><div id="neighbor" class="face back page test-page"><canvas width="600" height="824"></canvas></div></div></div></div></div>
<script src="/paper-dynamics.js?v=paper-arc-13"></script><script src="/paper-surface.js?v=paper-arc-13"></script><script src="/paper-turn.js?v=paper-arc-13"></script><script>
(async()=>{
 const html=await (await fetch('/index.html')).text(),parsed=new DOMParser().parseFromString(html,'text/html'),style=document.createElement('style');style.textContent=parsed.querySelector('style').textContent;document.head.prepend(style);
 const current=document.querySelector('#current'),neighbor=document.querySelector('#neighbor'),book=document.querySelector('#book');let paper,generation=0;const marker=document.createElement('span');marker.className='finger-target';marker.hidden=true;book.append(marker);
 function paint(face,number,color,description){face.replaceChildren();const label=document.createElement('div'),heading=document.createElement('h2'),text=document.createElement('p'),note=document.createElement('p'),folio=document.createElement('span');label.className='plate-label';label.textContent='SINGLE PAGE READER';heading.textContent='PAGE '+number;text.textContent=description||(number===2?'The current sheet curls away.':'The adjacent page lies underneath.');note.textContent='Readable text stays on its own page.';folio.className='plate-number';folio.textContent=number;face.append(label,heading,text,note,folio);}
 paint(current,2,'#fff8e8');
 function draw(){if(!paper||paper.disposed)return;const amount=Number(document.querySelector('#amount').value),delta=Number(document.querySelector('#direction').value),following=document.querySelector('#follow').checked;
  if(following){const v=.98,dy=Number(document.querySelector('#vertical').value),state=PaperDynamics.drag({...(delta<0?{incoming:true}:{forward:true}),delta,x:delta<0?0:300,y:v*412,width:300,height:412,u:1,v},delta<0?amount*300:(1-amount)*300,(v+dy)*412);paper.follow(state.progress,state.grip);marker.hidden=false;marker.style.left=state.grip.targetX*300+'px';marker.style.top=state.grip.targetY*412+'px';}
  else{paper.stopAnimation();paper.dragged=false;paper.grip=null;paper.seek(delta>0?amount:1-amount);marker.hidden=true;}
 }
 async function rebuild(){const request=++generation;paper?.destroy();paper=null;current.classList.add('single-current');neighbor.classList.remove('single-current');const delta=Number(document.querySelector('#direction').value),page=2+delta;paint(current,2,'#fff8e8',delta<0?'The current page stays underneath.':null);paint(neighbor,page,'#e1ebe3',delta<0?'The previous page comes from the left.':null);const moving=delta<0?neighbor:current;const next=await PaperTurn.create({book,front:moving,back:moving,blankSide:'back',underlay:delta<0?current:neighbor,hidden:moving,incoming:delta<0,single:true,delta,cornerV:1});if(request!==generation){next.destroy();return;}paper=next;paper.mount();draw();document.querySelector('#result').textContent=delta>0?'Page 2 follows the marker; page 3 stays underneath.':'Page 1 follows the marker; page 2 stays underneath.';}
 for(const id of ['amount','vertical'])document.querySelector('#'+id).oninput=()=>paper?.disposed?rebuild():draw();
 document.querySelector('#follow').onchange=draw;document.querySelector('#direction').onchange=rebuild;
 document.querySelector('#release').onclick=async()=>{if(!paper||paper.disposed)return;const complete=Number(document.querySelector('#amount').value)>=.55,delta=Number(document.querySelector('#direction').value);marker.hidden=true;paper.setMomentum(0);await paper.animate(delta<0?(complete?0:1):(complete?1:0));if(complete){current.classList.remove('single-current');neighbor.classList.add('single-current');}await paper.reveal();paper.destroy();document.querySelector('#result').textContent=complete?'Turn landed; page '+(2+delta)+' is current.':`Spring returned ${delta<0?'left':'right'}; page 2 is unchanged.`;};await rebuild();
})().catch(error=>document.querySelector('#result').textContent='FAILED: '+error.message);
</script></body></html>
